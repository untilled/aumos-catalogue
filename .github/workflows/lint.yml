# The submission rules, on every pull request. Two kinds of thing arrive here —
# an ManagerPackage under `managers/` and a data source under `sources/` — and each
# has its own checker, both copied out of the Aumos repository, both guarded by
# a test there that fails Aumos's own build the moment a copy differs from its
# source. See `tools/lint/VENDORED.md` and `tools/lint-sources/VENDORED.md`.
#
# ── The two are not equally strong, and the difference is written down ──────
#
# The ManagerPackage lint is your **fast feedback**: the real rules run again in
# the Aumos repository at merge, so a stale copy here can pass something the
# merge refuses. The source lint runs **both halves of the real check** — a
# schema generated from the same zod source Aumos parses with, and
# `coherence.ts`, which is the same file Aumos runs — so a green tick there
# means what the merge means, minus one named rule (the broker ceiling).
#
# ── Why the rules are copied here rather than installed ────────────────────
#
# The Aumos repository is private, and a pull request from a fork is given no
# secrets by GitHub — by design, and correctly. So "check out the private repo
# with a token" is unavailable for exactly the pull requests this workflow
# exists to greet. Copying readable source is the answer that survives that,
# and the cost is written down where it can be checked: a stale copy can pass a
# submission the merge will refuse, and can **never** publish one — the Aumos
# repository regenerates the catalogue from these files with its own rules, and
# a test there bounds how long any copy can be behind. The paragraph above is
# which of the two copies that caveat still bites.

name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This workflow judges submitted text and has no reason to touch
# anything, and a fork's pull request should be able to see that from here.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Both `check:index` and `check:pins` resolve commits that entries
          # are pinned to, and a depth-1 clone does not have them. The history
          # is small and the alternative is a check that passes for the wrong
          # reason — one that reports what it could not establish.
          #
          # ⚠️ One `fetch-depth` for both, deliberately. Two checks needing the
          # same clone is not two reasons to set it, and a second copy of this
          # comment is the thing that goes stale when one of them stops caring.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22 for `--experimental-strip-types`: the vendored lint is TypeScript
          # source a contributor can read, run directly, with no build step to
          # go stale between the code and what ran.
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run lint:sources

      # The two documents an installed Aumos actually fetches. The two lints
      # above judge the submitted directories; until this step nothing judged
      # the indexes that *name* them, and a malformed entry there is dropped
      # from every machine's catalogue in silence. `tools/check-index.mjs` says
      # more, including why this is not the Aumos schema copied a third time.
      - run: npm run check:index

      # Who may wear a reserved publisher name. ⚠️ **Not enforcement** — a
      # fork's pull request can edit the roster exactly as it can edit the
      # entry — and `tools/check-publisher.mjs` is blunt about that. What it
      # buys is that claiming `aumos` cannot be done *quietly*: it stops being
      # one field inside an entry a submitter writes anyway and also becomes a
      # one-line diff in a file whose only subject is whose packages these are.
      - run: npm run check:publisher

      # A ported package and the `harness.json` beside it have to agree — one
      # commit, one licence, one notice, one capability list, and a graph whose
      # roles are actually in the prompt in that order.
      #
      # ⚠️ **These ran in `untilled/aumos` and moved here** (that repository's
      # #477): they need the package **and** its spec together, and after it
      # deleted its copy of the published packages only this repository has
      # both. A package with no `harness.json` is skipped rather than refused —
      # most packages are nobody's derivative.
      - run: npm run check:provenance

      # The English and Korean documents are the same document twice, and a
      # section on one side and not the other is a rule a contributor is never
      # told about — and is then refused for. Structure only; nothing here
      # judges a translation, because a script cannot.
      - run: npm run check:docs

      # `runtime-files-are-present` in the vendored lint checks that
      # `.claude-plugin/plugin.json` exists; this checks that what is in it
      # agrees with `aumos.json`. It sits here rather than beside `check:pins`
      # because it judges the submission — a package PR should see its result,
      # and the paragraph below explains why anything after `check:pins` does
      # not run on one.
      - run: npm run check:plugin

      # `evidence-gated` ships a deterministic core rather than asking
      # a model to do arithmetic, and the two things that keeps honest are only
      # true while somebody checks them: that the fixtures still describe what
      # the code does, and that the port still produces the numbers the Python
      # it was ported from produced.
      #
      # Both are plain Node over committed JSON — no install, no network, no
      # private checkout. Re-measuring the legacy side needs that checkout and
      # stays an operator step (`tools/legacy-parity.mjs --freeze`); what runs
      # here is the comparison against what was measured — once, because the
      # three members became one package and there is no longer a second copy
      # of those bytes to disagree with.
      - run: npm run check:allocator

      # ── Last, and that position is the point ──────────────────────────────
      #
      # The pair to `check:index`, and a different question: `check:index` asks
      # whether an entry **resolves**, this asks whether what it resolves to is
      # what is committed beside it. A pin names a commit that already exists,
      # so the commit that fixes a package cannot pin itself — the repin is a
      # separate step, and a step that lives in somebody's memory is one that is
      # skipped.
      #
      # ⚠️ **Which means this step is red on every pull request that changes a
      # package, by construction rather than by mistake.** It ran fourth for a
      # while and the cost was measured over three consecutive package pull
      # requests: `steps` are sequential and a failure ends the job, so an
      # expected red shadowed `check:publisher`, `check:provenance`,
      # `check:docs` and `check:allocator` — the four that actually judge the
      # submission — and none of them ran on any of the three. One of those pull
      # requests was extending `check:allocator` itself, and its new assertions
      # were never executed by CI.
      #
      # Moving it last changes nothing about what is checked or about the job's
      # result: an unrepinned pull request still fails. What it buys is that the
      # failure no longer hides the checks a reviewer needs.
      - run: npm run check:pins
