# The catalogue mirror on aumos.app, re-baked on every merge to main. (#256)
#
# `aumos.app/managers` does not read this repository. It draws
# `apps/web/landing/data/managers.json` in `untilled/aumos`, which
# `pnpm --filter @aumos/web registry:generate` writes from this repository's
# `.claude-plugin/marketplace.json` at `HEAD` — and until this workflow existed
# that command was run by a person, which is why three packages merged on
# 2026-09-10 were invisible on the site until 2026-09-12 and nine others sat a
# version behind.
#
# So: a merge to `main` that touches what the marketplace publishes re-runs the
# generator over there, and — only when the output differs — opens a pull request
# in `untilled/aumos` and merges it. Vercel deploys `aumos.app` from that
# repository's `main`, so the page follows within minutes.
#
# ── What it needs, and why a secret ───────────────────────────────────────
#
# `AUMOS_PUBLISH_TOKEN`: a fine-grained token for `untilled/aumos` with
# `contents: write` and `pull-requests: write`. The repository is private, and
# `GITHUB_TOKEN` here cannot see it. The merge uses `--admin` because that
# repository's required check is its own CI, which a PR made of generated JSON
# has no reason to wait on and which — at the time of writing — was not running
# at all (org billing). Whoever the token belongs to is who the merge is
# recorded as.
#
# ── What it does not do ───────────────────────────────────────────────────
#
# ⛔ It does not touch the 🔒 half. `registry:generate` also rewrites
# `apps/web/releases/public/agents/registry.json`, and that file reaches
# `releases.aumos.app` only when a person runs `deploy:releases` — the README
# over there argues why an endpoint a binary fetches is never auto-deployed.
# This workflow commits the regenerated bytes (they are what the 🟢 page was
# built from, and a person deploying later gets the same commit) and stops.
#
# ⚠️ `landing/data/sources.json` is restored after generating, until
# untilled/aumos#906 is settled: regenerating it drops `alpaca`/`toss`, which
# this repository no longer publishes but the frozen source index still lists,
# and that turns `registry.test.tsx` red. Delete the restore step with #906.

name: publish-mirror

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'
      - '.aumos/**'
      - 'managers/**'
      - 'sources/**'
  workflow_dispatch:

concurrency:
  group: publish-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out untilled/aumos
        uses: actions/checkout@v4
        with:
          repository: untilled/aumos
          token: ${{ secrets.AUMOS_PUBLISH_TOKEN }}
          # The generator fetches this repository's marketplace at HEAD over
          # HTTPS; it does not read the checkout that triggered this run.
          fetch-depth: 1

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate the mirror from this repository's HEAD
        run: pnpm --filter @aumos/web registry:generate

      - name: Keep sources.json until untilled/aumos#906
        run: git checkout -- apps/web/landing/data/sources.json

      - name: Is there anything to publish?
        id: diff
        run: |
          git add -A apps/web
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: The page's own tests, against the regenerated data
        if: steps.diff.outputs.changed == 'true'
        run: pnpm --filter @aumos/web typecheck && pnpm --filter @aumos/web test

      - name: Open and merge the mirror pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUMOS_PUBLISH_TOKEN }}
          CATALOGUE_SHA: ${{ github.sha }}
        run: |
          short="${CATALOGUE_SHA:0:12}"
          branch="mirror/catalogue-${short}"
          git config user.name "aumos-catalogue mirror"
          git config user.email "noreply@aumos.app"
          git checkout -b "$branch"
          git commit -q -m "chore(web): 카탈로그 미러를 ${short}로 다시 굽는다 (untilled/aumos-catalogue@${short})

untilled/aumos-catalogue의 main이 움직여서 publish-mirror 워크플로가 registry:generate를 다시 돌렸다.
🔒 releases/public/agents/registry.json도 함께 구워졌고, 그 절반은 deploy:releases를 사람이 돌려야 닿는다."
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "chore(web): 카탈로그 미러를 ${short}로 다시 굽는다" \
            --body "untilled/aumos-catalogue@${CATALOGUE_SHA} 가 main에 들어와 \`publish-mirror\`가 구웠다. 생성물만 바뀌었고 사람이 쓴 줄은 없다. 🔒 절반(\`releases.aumos.app\`)은 \`deploy:releases\`를 기다린다.")
          echo "$url"
          gh pr merge "$url" --merge --delete-branch --admin
